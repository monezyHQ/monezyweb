<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Enchanted Archives</title>
    
    <!-- Magical & Storybook Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Enchanted Variables --- */
        :root {
            --bg-midnight: #0B132B;
            --bg-twilight: #1C2541;
            --gold-light: #F9E596;
            --gold-rich: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --glass-panel: rgba(28, 37, 65, 0.6);
            --parchment: #FDFBF7;
            --text-dark: #2C3E50;
            --text-light: #EAEAEA;
            
            --font-ui: 'Quicksand', sans-serif;
            --font-magic: 'Cinzel', serif;
            --font-script: 'Dancing Script', cursive;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-ui);
            background: radial-gradient(circle at 50% 0%, var(--bg-twilight) 0%, var(--bg-midnight) 100%);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- CSS Pixie Dust (Background Animation) --- */
        .dust-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, var(--gold-light), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 50px 160px, var(--gold-light), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, var(--gold-light), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: drift 60s linear infinite;
            opacity: 0.4;
        }

        @keyframes drift {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        /* --- Header --- */
        header {
            padding: 25px 40px;
            text-align: center;
            position: relative;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(11, 19, 43, 0.9), transparent);
        }

        header h1 {
            font-family: var(--font-magic);
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--gold-light);
            text-shadow: 0 0 15px var(--gold-glow);
            letter-spacing: 2px;
        }

        /* --- Main Layout --- */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 5;
            padding: 0 20px 20px 20px;
            gap: 20px;
        }

        /* --- Left Input Panel (The Spellbook) --- */
        .input-panel {
            width: 420px;
            background: var(--glass-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 35px 30px;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.05), 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-panel::-webkit-scrollbar { width: 6px; }
        .input-panel::-webkit-scrollbar-thumb { background: var(--gold-rich); border-radius: 10px; }

        .input-panel h2 {
            font-family: var(--font-magic);
            color: var(--gold-rich);
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gold-light);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        input[type="text"], input[type="date"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            font-family: var(--font-ui);
            font-size: 0.95rem;
            color: white;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
            outline: none;
            border-color: var(--gold-rich);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        textarea { height: 100px; resize: none; }

        .btn-add {
            background: linear-gradient(135deg, var(--gold-rich), #F9E596, var(--gold-rich));
            background-size: 200% auto;
            color: var(--bg-midnight);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
            font-family: var(--font-ui);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.5s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px var(--gold-glow);
        }

        .btn-add:hover { background-position: right center; transform: translateY(-2px); }
        .btn-add:active { transform: translateY(1px); }

        .btn-print {
            background: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-rich);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
        }
        .btn-print:hover { background: var(--gold-glow); }

        /* --- Right Preview Panel (The Canvas) --- */
        .preview-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slideshow-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: var(--parchment);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 60px rgba(139, 115, 85, 0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 8px solid white;
        }

        /* Gold corners for the storybook feel */
        .slideshow-container::before, .slideshow-container::after {
            content: ''; position: absolute; width: 40px; height: 40px; border: 2px solid var(--gold-rich); pointer-events: none; z-index: 10;
        }
        .slideshow-container::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .slideshow-container::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            padding: 40px 60px;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        .slide.active { display: flex; opacity: 1; z-index: 2; }

        /* Slide Content */
        .slide-photo-container {
            flex: 1;
            max-width: 350px;
            background: white;
            padding: 12px 12px 40px 12px; /* Polaroid effect */
            box-shadow: 2px 8px 20px rgba(0,0,0,0.15);
            transform: rotate(-3deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .slide-photo-container:hover { transform: rotate(1deg) scale(1.05); z-index: 5; }

        .slide-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 2px;
            filter: sepia(10%);
        }

        .slide-text-content {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: var(--text-dark);
        }

        .slide-title {
            font-family: var(--font-magic);
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--bg-midnight);
            line-height: 1.1;
        }

        .slide-info {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--gold-rich);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }

        .slide-notes {
            font-family: var(--font-script);
            font-size: 2.2rem;
            line-height: 1.5;
            color: #4A4A4A;
        }

        /* Navigation Controls */
        .nav-btn {
            cursor: pointer;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: var(--gold-rich);
            color: var(--bg-midnight);
            font-family: var(--font-magic);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 15px var(--gold-glow);
            transition: 0.3s;
            z-index: 10;
            border: 2px solid white;
        }
        .nav-btn:hover { background: white; color: var(--gold-rich); transform: translateY(-50%) scale(1.1); }
        .prev { left: -25px; }
        .next { right: -25px; }

        .slide-counter {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold-light);
            font-family: var(--font-magic);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .no-entries-msg {
            font-family: var(--font-script);
            font-size: 2.5rem;
            color: var(--gold-light);
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 2px 20px var(--gold-glow); }
        }

        /* ========================================= */
        /* --- ENCHANTED PRINT STYLES --- */
        /* ========================================= */
        #print-content { display: none; }

        @media print {
            @page { size: landscape; margin: 0; }
            html, body {
                width: auto !important; height: auto !important;
                background: var(--parchment) !important; color: var(--text-dark) !important;
            }
            header, .container, .dust-particles { display: none !important; }

            #print-content { display: block !important; width: 100%; }

            .print-page {
                width: 100vw; height: 100vh;
                page-break-after: always;
                padding: 50px; box-sizing: border-box;
                display: flex !important; align-items: center; justify-content: center; gap: 50px;
                border: 15px solid transparent;
                border-image: linear-gradient(to right, var(--gold-rich), #F9E596, var(--gold-rich)) 1;
            }

            .print-photo-container {
                flex: 1; max-width: 400px;
                padding: 15px 15px 50px 15px;
                background: white; border: 1px solid #ddd;
                box-shadow: 5px 10px 15px rgba(0,0,0,0.1) !important;
                transform: rotate(-2deg);
            }

            .print-image { width: 100%; height: 400px; object-fit: cover; filter: sepia(15%); }

            .print-text-content { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }

            .print-title { font-family: var(--font-magic); font-size: 3.5rem; color: #111; }
            .print-info { font-family: var(--font-ui); font-size: 1.2rem; color: var(--gold-rich); font-weight: bold; border-bottom: 2px solid var(--gold-rich); padding-bottom: 10px; }
            .print-notes { font-family: var(--font-script); font-size: 2.5rem; line-height: 1.4; color: #333; }
        }
    </style>
</head>
<body>

    <div class="dust-particles"></div>

    <header>
        <h1>The Enchanted Archives</h1>
    </header>

    <div class="container">
        <!-- The Spellbook (Input) -->
        <aside class="input-panel">
            <h2>✨ Chronicle a Tale</h2>
            <form id="scrapbook-form">
                <div class="form-group">
                    <label for="date">When did the magic happen?</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="location">Where did this unfold?</label>
                    <input type="text" id="location" placeholder="e.g., A lantern-lit boat ride" required>
                </div>
                <div class="form-group">
                    <label for="title">The Chapter Title</label>
                    <input type="text" id="title" placeholder="e.g., I See The Light" required>
                </div>
                <div class="form-group">
                    <label for="notes">Pen the details...</label>
                    <textarea id="notes" placeholder="What made this moment unforgettable?"></textarea>
                </div>
                <div class="form-group">
                    <label for="image">Attach a vision (Optional)</label>
                    <input type="file" id="image" accept="image/*">
                </div>
                <button type="submit" class="btn-add">Seal this Memory ✨</button>
            </form>
            <button class="btn-print" onclick="window.print();">Export Tome to Parchment 🖨️</button>
        </aside>

        <!-- The Canvas (Preview) -->
        <main class="preview-panel">
            <div id="no-entries" class="no-entries-msg">The pages are blank.<br>Begin writing your story on the left.</div>
            <div id="slideshow-wrapper" style="display: none; position: relative; width: 100%; max-width: 900px;">
                <div class="slideshow-container" id="slideshow">
                    <!-- Slides injected via JS -->
                </div>
                <div class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</div>
                <div class="nav-btn next" onclick="changeSlide(1)">&#10095;</div>
                <div class="slide-counter">Memory <span id="current-index">1</span> of <span id="total-entries">0</span></div>
            </div>
        </main>
    </div>

    <!-- Hidden Print Container -->
    <div id="print-content"></div>

    <script>
        const state = { entries: [], currentIndex: 0 };
        
        const DOM = {
            form: document.getElementById('scrapbook-form'),
            noEntries: document.getElementById('no-entries'),
            slideWrapper: document.getElementById('slideshow-wrapper'),
            slideshow: document.getElementById('slideshow'),
            printBox: document.getElementById('print-content'),
            currentSpan: document.getElementById('current-index'),
            totalSpan: document.getElementById('total-entries')
        };

        DOM.form.addEventListener('submit', handleSubmission);

        function handleSubmission(e) {
            e.preventDefault();
            const fileInput = document.getElementById('image');
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => saveEntry(event.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveEntry(null); 
            }
        }

        function saveEntry(imageUrl) {
            const rawDate = document.getElementById('date').value;
            const dateObj = new Date(rawDate);
            
            const entry = {
                date: dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
                location: document.getElementById('location').value,
                title: document.getElementById('title').value,
                notes: document.getElementById('notes').value,
                imageUrl: imageUrl
            };

            state.entries.push(entry);
            DOM.form.reset();
            state.currentIndex = state.entries.length - 1; // Jump to newest
            render();
        }

        function render() {
            if (state.entries.length === 0) return;

            DOM.noEntries.style.display = 'none';
            DOM.slideWrapper.style.display = 'block';
            DOM.totalSpan.textContent = state.entries.length;
            
            DOM.slideshow.innerHTML = '';
            DOM.printBox.innerHTML = ''; 

            state.entries.forEach((entry, index) => {
                // 1. Render DOM Slide
                const slide = document.createElement('div');
                slide.className = `slide ${index === state.currentIndex ? 'active' : ''}`;
                
                const imageHTML = entry.imageUrl 
                    ? `<img src="${entry.imageUrl}" class="slide-image" alt="Memory">` 
                    : `<div style="color:#aaa; font-family:var(--font-ui); text-align:center; padding-top:40%;">A fleeting thought<br>(No visual)</div>`;

                slide.innerHTML = `
                    <div class="slide-photo-container">${imageHTML}</div>
                    <div class="slide-text-content">
                        <h2 class="slide-title">${entry.title}</h2>
                        <div class="slide-info">✨ ${entry.date} &nbsp;|&nbsp; 🏰 ${entry.location}</div>
                        <p class="slide-notes">${entry.notes.replace(/\n/g, '<br>')}</p>
                    </div>
                `;
                DOM.slideshow.appendChild(slide);

                // 2. Render Print Page
                const printPage = document.createElement('div');
                printPage.className = 'print-page';
                printPage.innerHTML = `
                    <div class="print-photo-container">${imageHTML.replace('slide-image', 'print-image')}</div>
                    <div class="print-text-content">
                        <h2 class="print-title">${entry.title}</h2>
                        <div class="print-info">${entry.date} &nbsp;|&nbsp; ${entry.location}</div>
                        <p class="print-notes">${entry.notes.replace(/\n/g, '<br>')}</p>
                    </div>
                `;
                DOM.printBox.appendChild(printPage);
            });

            updateCounter();
        }

        function changeSlide(direction) {
            const slides = document.querySelectorAll('.slide');
            if (!slides.length) return;

            slides[state.currentIndex].classList.remove('active');
            
            state.currentIndex += direction;
            if (state.currentIndex >= slides.length) state.currentIndex = 0;
            if (state.currentIndex < 0) state.currentIndex = slides.length - 1;
            
            // Slight delay allows display:flex to trigger before opacity fades in
            setTimeout(() => {
                slides[state.currentIndex].classList.add('active');
            }, 50);
            
            updateCounter();
        }

        function updateCounter() {
            DOM.currentSpan.textContent = state.currentIndex + 1;
        }
    </script>
</body>
</html>
